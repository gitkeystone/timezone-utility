version: 2

builds:
  - id: timezone-utility
    main: ./cmd/timezone-utility
    binary: timezone-utility
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'
